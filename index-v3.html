<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul's Workout Tracker V3</title>

<style>
body{
    background:#121212;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;
    margin:0;
    padding:20px;
}

h1{
    color:#4CAF50;
}

.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:20px;
}

.tabs button{
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin-bottom:20px;
}

.card{
    background:#1e1e1e;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.card h2{
    margin:0;
    color:#4CAF50;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #444;
    padding:8px;
}

input{
    width:100%;
    background:#202020;
    color:white;
    border:1px solid #555;
    padding:5px;
}

button.action{
    background:#4CAF50;
    color:white;
    border:none;
    padding:8px;
    margin:5px;
    cursor:pointer;
}

.deleteBtn{
    background:#aa2222;
}
</style>
</head>
<body>

<h1>🏋️ Paul's Workout Tracker V3</h1>

<div class="card-grid">

<div class="card">
<h2 id="exerciseCount">0</h2>
<p>Exercises</p>
</div>

<div class="card">
<h2 id="setCount">0</h2>
<p>Total Sets</p>
</div>

<div class="card">
<h2 id="volumeCount">0</h2>
<p>Total Volume</p>
</div>

<div class="card">
<p>Weight (kg)</p>
<input id="bodyWeight" value="94">
</div>

<div class="card">
<p>Waist (in)</p>
<input id="waist" value="36">
</div>

</div>
<div class="card-grid">

<div class="card">
<h2 id="chestSets">0</h2>
<p>Chest Sets</p>
</div>

<div class="card">
<h2 id="tricepSets">0</h2>
<p>Triceps Sets</p>
</div>

<div class="card">
<h2 id="shoulderSets">0</h2>
<p>Shoulder Sets</p>
</div>

<div class="card">
<h2 id="bicepSets">0</h2>
<p>Biceps Sets</p>
</div>

<div class="card">
<h2 id="backSets">0</h2>
<p>Back Sets</p>
</div>

<div class="card">
<h2 id="legSets">0</h2>
<p>Leg Sets</p>
</div>

</div>
<div class="tabs" id="tabs"></div>

<h2 id="dayTitle"></h2>

<button class="action" onclick="addExercise()">Add Exercise</button>

<table>

<thead>
<tr>
<th>Area</th>
<th>Exercise</th>
<th>Sets</th>
<th>Reps</th>
<th>Weight</th>
<th>Delete</th>
</tr>
</thead>

<tbody id="workoutTable">
</tbody>

</table>

<script>

const defaultData = {

"Monday":[

["Chest","2 Pec deck exercises",3,12,0],
["Chest","Dumbell lift up and down (2 handed) above head",3,12,13.5],
["Chest","Open and shut arms with dumbells in each hand chest height",3,12,8],
["Chest","Standing wide dumbell raise inward and across body",3,12,10.5],
["Chest","Dumbell low swing in and out in front of body",3,12,13.5],
["Chest","Wide arm press ups",3,20,0],

["Triceps","Dips on bench",3,20,0],
["Triceps","Tricep push ups",3,20,0],
["Triceps","Cable pull across body",3,12,0],
["Triceps","Cable pull downs",3,12,0],
["Triceps","Overhead cable pulls",3,12,0],
["Triceps","Barbell reverse extension",3,12,8]

],

"Tuesday":[

["Shoulders","Shoulder height face cable pull",3,12,0],
["Shoulders","Shoulder shrugs",3,12,16],
["Shoulders","Lateral side raises",3,12,8],
["Shoulders","Rear lateral raises",3,12,8],
["Shoulders","Front lateral raises",3,12,8],

["Biceps","Bent over bar raises",3,12,12],
["Biceps","Waiter dumbell raise (palms up)",3,12,16],
["Biceps","Dumbell cross body raise",3,12,11.5],
["Biceps","Hammer curls (seated 2 handed)",3,12,13.5],
["Biceps","Incline dumbell raise on bench",3,12,10.5],
["Biceps","Preacher curls",3,12,13.5]

],

"Wednesday":[],

"Thursday":[

["Chest","2 Pec deck exercises",3,12,0],
["Chest","Incline dumbell bench press",3,12,13.5],
["Chest","Incline dumbell bench press - dumbells together",3,12,13.5],
["Chest","Incline reverse dumbell pushup",3,12,10.5],
["Chest","Incline dumbells up and over body",3,12,10.5],
["Chest","Incline dumbell butterfly press",3,12,10.5],

["Triceps","Bar pull down hands frontwards",3,12,0],
["Triceps","Bar pull down hands reversed",3,12,0],
["Triceps","Overhead cable pull",3,12,0],
["Triceps","Cable pull downwards",3,12,0],
["Triceps","Side arms cable pulls",3,12,0]

],

"Friday":[

["Shoulders","Shoulder shrugs",3,12,16],
["Shoulders","Seated Lateral side raises",3,12,8],
["Shoulders","Seated Rear lateral raises",3,12,8],
["Shoulders","Seated Front lateral raises",3,12,8],
["Shoulders","Incline shoulder press",3,12,11.5],

["Biceps","Concentration curls",3,12,13.5],
["Biceps","Dumbell cross body raise",3,12,11.5],
["Biceps","Dumbell raises in front",3,12,11.5],
["Biceps","Forearm raises",3,12,6],
["Biceps","Standing in and out dumbell raises",3,12,11.5],
["Biceps","Standing hammer curls",3,12,13.5],
["Biceps","Circle Weight lift 2 handed",3,12,10]

],

"Saturday":[
["Back","Cable Row",3,12,0],
["Back","Wide Pulldown",3,12,0],
["Legs","Squats",3,20,0]
],

"Sunday":[]
};

let data = JSON.parse(localStorage.getItem("workoutData")) || defaultData;

let currentDay = "Monday";

function save(){

localStorage.setItem(
"workoutData",
JSON.stringify(data)
);

calculateTotals();
}

function calculateTotals(){

let exerciseCount = 0;
let totalSets = 0;
let totalVolume = 0;
let muscleTotals = {
    Chest:0,
    Triceps:0,
    Shoulders:0,
    Biceps:0,
    Back:0,
    Legs:0
};

Object.values(data).forEach(day=>{

day.forEach(row=>{

exerciseCount++;

const area = row[0];

const sets = Number(row[2]) || 0;
const reps = Number(row[3]) || 0;
const weight = Number(row[4]) || 0;

totalSets += sets;
totalVolume += sets * reps * weight;

if(muscleTotals[area] !== undefined){
    muscleTotals[area] += sets;
}
    
});

});

document.getElementById("exerciseCount").innerText =
exerciseCount;

document.getElementById("setCount").innerText =
totalSets;

document.getElementById("volumeCount").innerText =
totalVolume.toLocaleString();
document.getElementById("chestSets").innerText =
muscleTotals.Chest;

document.getElementById("tricepSets").innerText =
muscleTotals.Triceps;

document.getElementById("shoulderSets").innerText =
muscleTotals.Shoulders;

document.getElementById("bicepSets").innerText =
muscleTotals.Biceps;

document.getElementById("backSets").innerText =
muscleTotals.Back;

document.getElementById("legSets").innerText =
muscleTotals.Legs;
}

function renderTabs(){

const tabs = document.getElementById("tabs");

tabs.innerHTML = "";

Object.keys(data).forEach(day=>{

const btn = document.createElement("button");

btn.innerText = day;

btn.onclick = ()=>{

currentDay = day;

renderTable();

};

tabs.appendChild(btn);

});

}

function renderTable(){

document.getElementById("dayTitle").innerText =
currentDay;

const table =
document.getElementById("workoutTable");

table.innerHTML = "";

data[currentDay].forEach((row,index)=>{

const tr = document.createElement("tr");

row.forEach((value,col)=>{

const td = document.createElement("td");

const input = document.createElement("input");

input.value = value;

input.onchange = ()=>{

data[currentDay][index][col] =
input.value;

save();

};

td.appendChild(input);

tr.appendChild(td);

});

const deleteCell =
document.createElement("td");

const deleteBtn =
document.createElement("button");

deleteBtn.innerText = "Delete";

deleteBtn.className = "deleteBtn";

deleteBtn.onclick = ()=>{

data[currentDay].splice(index,1);

save();

renderTable();

};

deleteCell.appendChild(deleteBtn);

tr.appendChild(deleteCell);

table.appendChild(tr);

});

calculateTotals();

}

function addExercise(){

data[currentDay].push([
"",
"",
3,
12,
0
]);

save();

renderTable();

}

renderTabs();
renderTable();

</script>

</body>
</html>
