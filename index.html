<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Workout Tracker</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    margin:20px;
}

h1{
    color:#4CAF50;
}

button{
    background:#4CAF50;
    color:white;
    border:none;
    padding:10px;
    cursor:pointer;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #444;
    padding:8px;
}

input{
    width:100%;
    background:#222;
    color:white;
    border:1px solid #555;
    padding:5px;
}
</style>
</head>

<body>

<h1>Workout Tracker</h1>

<button onclick="addRow()">Add Exercise</button>

<p>
Exercises: <span id="exerciseCount">0</span>
</p>

<table>
<thead>
<tr>
<th>Day</th>
<th>Area</th>
<th>Exercise</th>
<th>Sets</th>
<th>Reps</th>
<th>Weight</th>
</tr>
</thead>

<tbody id="workoutBody">
</tbody>

</table>

<script>

let workouts = [
    ["Monday","Chest","Pec Deck",3,12,50],
    ["Monday","Triceps","Push Down",3,12,40],
    ["Tuesday","Biceps","Hammer Curl",3,12,13.5]
];

function render() {

    const body = document.getElementById("workoutBody");

    body.innerHTML = "";

    workouts.forEach(function(row){

        let tr = document.createElement("tr");

        row.forEach(function(value){

            let td = document.createElement("td");

            let input = document.createElement("input");

            input.value = value;

            td.appendChild(input);

            tr.appendChild(td);

        });

        body.appendChild(tr);

    });

    document.getElementById("exerciseCount").innerText = workouts.length;
}

function addRow(){

    workouts.push([
        "Day",
        "Area",
        "Exercise",
        3,
        12,
        0
    ]);

    render();
}

render();

</script>

</body>
</html>
