<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paul's Workout Tracker</title>

<style>
:root{
    --bg:#0f1115;
    --card:#1c1f26;
    --accent:#58c45a;
    --text:#ffffff;
    --border:#303542;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Segoe UI, Arial, sans-serif;
    padding:20px;
}

h1{
    text-align:center;
    color:var(--accent);
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:var(--card);
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.card h2{
    margin:0;
    color:var(--accent);
    font-size:32px;
}

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button{
    background:var(--accent);
    border:none;
    color:white;
    padding:10px 15px;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
}

button:hover{
    opacity:0.9;
}

table{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
}

th{
    background:#262b35;
    padding:12px;
}

td{
    border:1px solid var(--border);
    padding:8px;
}

input,select{
    width:100%;
    background:#12151b;
    color:white;
    border:1px solid #444;
    padding:6px;
}

.deleteBtn{
    background:#cc3333;
}

.section-title{
    margin-top:35px;
    margin-bottom:15px;
    color:var(--accent);
}

@media(max-width:900px){
    table{
        font-size:12px;
    }
}
</style>
</head>

<body>

<h1>🏋️ Paul's Workout Tracker</h1>

<div class="dashboard">

    <div class="card">
        <h2 id="totalExercises">0</h2>
        <p>Exercises</p>
    </div>

    <div class="card">
        <h2 id="totalSets">0</h2>
        <p>Total Sets</p>
    </div>

    <div class="card">
        <h2 id="totalWeight">0</h2>
        <p>Total Weight</p>
    </div>

    <div class="card">
        <h2 id="totalVolume">0</h2>
        <p>Total Volume</p>
    </div>

</div>

<div class="dashboard">

    <div class="card">
        <label>Current Weight (kg)</label>
        <input id="bodyWeight" type="number" value="94">
    </div>

    <div class="card">
        <label>Waist (inches)</label>
        <input id="waist" type="number" value="36">
    </div>

</div>

<div class="toolbar">
    <button onclick="addRow()">Add Exercise</button>
    <button onclick="exportData()">Export Backup</button>
</div>

<h2 class="section-title">Workout Schedule</h2>

<table>

<tr>
